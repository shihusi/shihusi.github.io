---
layout: default
---
<div class="blog">
  {% if page.title %}
    <h1 class="page-heading">{{ page.title }}</h1>
  {% endif %}
  {{ content }}

  <p class="blog-post-list">
    {% for post in site.posts %}

      {% if post.draft != true %}
        <span class="blog-post-date">{{ post.date | date: "%m/%d/%y" }}</span>
        <a href="{{ post.url | replace:".html","" | prepend: site.baseurl }}" class="blog-post-title">
          {{ post.title }}
        </a>
        <br />

      {% endif %}

    {% endfor %}
  </p>
</div>

<script defer src="{{ '/assets/js/blog-almanac.js' | relative_url }}"></script>
