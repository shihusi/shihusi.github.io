<footer class="site-contact">
  {% for contact in site.footer.contact %}
    <a href="{{ contact.link }}" id="{{ contact.name | downcase }}-link">{{ contact.name }}</a>
  {% endfor %}
  <a href="https://scholar.google.com/citations?user=e8LSJ_4AAAAJ">Google Scholar</a>
  {% for follow in site.footer.follow %}
    <a href="{{ follow.link }}">{{ follow.name }}</a>
  {% endfor %}
  {% if site.footer.show_powered_by %}
    <a href="https://github.com/eliottvincent/bay">Bay</a>
  {% endif %}
  <div class="footer-actions">
    {% include next-page.html %}
    <button class="rain-silence" type="button" hidden>
      <span class="rain-label" aria-hidden="true"><span>Silence</span><span>Flow</span></span>
    </button>
  </div>
</footer>
{% include wechat-widget.html %}
