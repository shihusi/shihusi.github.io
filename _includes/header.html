<header class="site-header">
  <div class="wrapper">
    <button class="site-title theme-toggle" type="button" aria-label="Night mode" aria-pressed="false">
      <img src="{{ "/assets/img/sit.png" | relative_url }}" alt="" />
    </button>

    <nav class="site-nav" aria-label="Primary navigation">
      {% assign current_path = page.url | remove: ".html" %}

      <div class="menu" id="site-menu">
        {% for item in site.header.pages %}
          {% if item.slug and item.slug != "" and item.slug != nil %}
            {% assign page_link = item.slug %}
          {% else %}
            {% assign page_link = "/" | append: item.name | downcase %}
          {% endif %}
          <a class="page-link" href="{{ page_link | relative_url }}"{% if current_path == page_link %} aria-current="page"{% elsif page.layout == "post" and item.name == "Blog" %} aria-current="location"{% endif %}>
            {{ item.name }}
          </a>
        {% endfor %}
      </div>
    </nav>
  </div>
</header>
